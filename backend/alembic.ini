# Alembic configuration. The database URL is NOT set here: alembic/env.py takes it from
# backend.config (DATABASE_URL), so the same settings drive the app and the migrations.
# Run from the repository root:  alembic -c backend/alembic.ini upgrade head
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/..
file_template = %%(rev)s_%%(slug)s
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
