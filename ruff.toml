# Ruff configuration (lint only; CI runs `ruff check backend scripts` and the generator scripts).
#
# The rule set is deliberately small: it catches syntax errors, undefined names, broken
# comparisons and similar real bugs, but no style rules. It was tuned so the code base passes
# as it is; nothing in backend/ was changed to satisfy it.
#
# Rules that are NOT enforced, and why (candidates to turn on once the code is cleaned up):
#   F401  unused imports      - some imports are kept on purpose (re-exports, side effects)
#   F541  f-string without placeholders - cosmetic
#   F841  unused local variable - cosmetic
#   F811  redefinition of unused name - only silenced for tests (pytest fixtures are re-declared
#         as test arguments, which pyflakes reads as a redefinition)
#   E4/E7 (E402 import position, E701/E702/E711/E712/E731/E741) and all other pycodestyle rules
#         are not selected: backend/main.py configures logging before importing the application
#         on purpose (E402), and the rest are style.
target-version = "py312"
line-length = 120
extend-exclude = ["frontend"]

[lint]
select = ["E9", "F"]
ignore = ["F401", "F541", "F841"]

[lint.per-file-ignores]
"backend/tests/*" = ["F811"]
