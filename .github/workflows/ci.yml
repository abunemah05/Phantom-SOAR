name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      # backend/tests/conftest.py provides a throwaway SQLite DB and test secrets,
      # and strips third-party API keys, so no services or secrets are needed here.
      - name: Run pytest
        run: python -m pytest backend/tests -q -p no:warnings

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npx next build

  compose:
    name: Docker Compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Secrets are required (config must fail without them)
        run: |
          if docker compose config --quiet 2> /dev/null; then
            echo "docker compose config succeeded without secrets; a secret has a default again" >&2
            exit 1
          fi
      - name: Validate docker-compose.yml
        env:
          POSTGRES_PASSWORD: ci-placeholder
          REDIS_PASSWORD: ci-placeholder
          PHANTOM_JWT_SECRET: ci-placeholder
          PHANTOM_BOOTSTRAP_ADMIN_PASSWORD: ci-placeholder
          PHANTOM_INGEST_TOKEN: ci-placeholder
        run: docker compose config --quiet
